[package]
name = "redlines-desktop"
version = "0.1.0"
description = "The Redlines desktop app"
license = "MIT"
edition = "2024"
publish = false

[lib]
# A name apart from the binary's, which Cargo needs on Windows
# (https://github.com/rust-lang/cargo/issues/8519).
name = "redlines_desktop_lib"
# staticlib and cdylib are for mobile builds.
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
tauri = { version = "2.12.4", features = [] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri-plugin-dialog = "2"
tauri-plugin-fs = { version = "2", features = ["watch"] }
# Checks for, downloads, verifies and installs updates (updates.rs, src/updates.ts).
tauri-plugin-updater = "2.14.1"
# Reads what `hdiutil` says about disk images, and app versions, when installing from a disk image.
plist = "1.10.1"

# The window's icon, off the Mac, is read from a PNG (dock_icon.rs). The Mac sets the Dock icon
# without it, and the tests of the icon family read its PNGs the same way.
[target.'cfg(not(target_os = "macos"))'.dependencies]
tauri = { version = "2.12.4", features = ["image-png"] }

[dev-dependencies]
tauri = { version = "2.12.4", features = ["image-png"] }
# Tell the updater's public key in tauri.conf.json from anything else, as the updater reads it.
# Both are the updater's own dependencies.
base64 = "0.23"
minisign-verify = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
# The Dock icon (dock_icon.rs) and the install question's window buttons (install/macos.rs), set
# through AppKit. The versions and features are Tauri's own, so nothing more is built for them.
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSButton", "NSControl", "NSImage", "NSResponder", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSData"] }
# Installing from a disk image: finding where a translocated app really is, asking in an alert of
# the system's, and asking whether a process is still running.
core-foundation = "0.10.1"
core-foundation-sys = "0.8.7"

[target.'cfg(unix)'.dependencies]
# Asking whether a process is still running when installing from a disk image, signalling a run's
# process group (agents/process.rs), and the local time in a run's log (agents/log.rs).
libc = "0.2.190"
