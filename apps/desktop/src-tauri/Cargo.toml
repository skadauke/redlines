[package]
name = "redlines-desktop"
version = "0.2.0"
description = "The Redlines desktop app"
license = "MIT"
edition = "2024"
publish = false

[lib]
# A name apart from the binary's, which Cargo needs on Windows
# (https://github.com/rust-lang/cargo/issues/8519).
name = "redlines_desktop_lib"
# staticlib and cdylib are for mobile builds.
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
# `protocol-asset` serves the images of the project folders to the preview (project.rs).
tauri = { version = "2.12.4", features = ["protocol-asset"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri-plugin-dialog = "2"
# Without its `watch` feature: a window watches nothing itself (capabilities/default.json).
tauri-plugin-fs = "2"
# Watches each window's document through its folder, for the window (watch.rs). The file system
# plugin's own version.
notify = "8.2.1"
# Compares the names in its events as macOS does, by their composed Unicode form (watch.rs). Tauri's
# own, through `url`, with the same feature, so nothing more is built for it.
icu_normalizer = { version = "2.3.0", default-features = false, features = ["compiled_data"] }
# Checks for, downloads, verifies and installs updates (updates.rs).
tauri-plugin-updater = "2.14.1"
# The app's own update checks run on Tauri's runtime, which is tokio's, and wait with its timers
# (updates/checks.rs). Tauri's own dependency, with its timers turned on.
tokio = { version = "1", features = ["rt", "sync", "time"] }
# Reads what `hdiutil` says about disk images, and app versions, when installing from a disk image.
plist = "1.10.1"
tauri-plugin-clipboard-manager = "2"
# Lists the project's folders for the file sidebar as git would, leaving out what `.gitignore`
# ignores, without git (project.rs).
ignore = "0.4.34"
# Reads the path in the page's asset: URLs, which the app answers itself (images.rs). Tauri's own.
percent-encoding = "2.3.2"

# The window's icon, off the Mac, is read from a PNG (dock_icon.rs). The Mac sets the Dock icon
# without it, and the tests of the icon family read its PNGs the same way.
[target.'cfg(not(target_os = "macos"))'.dependencies]
tauri = { version = "2.12.4", features = ["protocol-asset", "image-png"] }

[dev-dependencies]
# `test` gives the tests a mock app, to make the file system plugin's own scope with (file_scope.rs).
tauri = { version = "2.12.4", features = ["image-png", "test"] }
# Tell the updater's public key in tauri.conf.json from anything else, as the updater reads it.
# Both are the updater's own dependencies.
base64 = "0.23"
minisign-verify = "0.3"
muda = { version = "0.20", default-features = false }
# The update checks' tests wait on tokio's paused clock, not the real one, and one runs on several
# threads (updates/checks.rs).
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "test-util"] }

[target.'cfg(target_os = "macos")'.dependencies]
# The Dock icon (dock_icon.rs), the install question's window buttons (install/macos.rs) and the
# question before an agent is added (agents/question.rs), set through AppKit; and the copies of
# the app that are running, when installing over one (install/macos.rs). The versions and
# features are Tauri's and its dialog plugin's own, so nothing more is built for them.
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "block2", "NSAlert", "NSApplication", "NSButton", "NSControl", "NSEvent", "NSImage", "NSResponder", "NSRunningApplication", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSData", "NSString", "NSURL"] }
block2 = "0.6.2"
# Answers macOS's question whether the app may quit from outside the event loop's own callback
# (windows.rs). Tauri's own version.
dispatch2 = "0.3.1"
# Installing from a disk image: finding where a translocated app really is, asking in an alert of
# the system's, and asking whether a process is still running.
core-foundation = "0.10.1"
core-foundation-sys = "0.8.7"

[target.'cfg(unix)'.dependencies]
# Asking whether a process is still running when installing from a disk image, signalling a run's
# process group (agents/process.rs), and the local time in a run's log (agents/log.rs).
libc = "0.2.190"
