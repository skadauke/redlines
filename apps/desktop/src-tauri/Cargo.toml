[package]
name = "redlines-desktop"
version = "0.0.0"
description = "The Redlines desktop app"
license = "MIT"
edition = "2024"
publish = false

[lib]
# A name apart from the binary's, which Cargo needs on Windows
# (https://github.com/rust-lang/cargo/issues/8519).
name = "redlines_desktop_lib"
# staticlib and cdylib are for mobile builds.
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
tauri = { version = "2.12.4", features = [] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri-plugin-dialog = "2"
tauri-plugin-fs = { version = "2", features = ["watch"] }
# Reads what `hdiutil` says about disk images, and app versions, when installing from a disk image.
plist = "1.10.1"

[target.'cfg(target_os = "macos")'.dependencies]
# Installing from a disk image: finding where a translocated app really is, asking in an alert of
# the system's, and asking whether a process is still running.
core-foundation = "0.10.1"
core-foundation-sys = "0.8.7"
libc = "0.2.190"
