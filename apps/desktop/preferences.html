<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Preferences</title>
  </head>
  <body>
    <!-- Preferences, in a small window of its own (src-tauri/src/lib.rs, open_preferences): a tab
         for each pane along the top, an icon with its name, and the pane under a thin rule, its
         rows in groups under small headings. The top is dragged by anything but its tabs. No
         sidebar, no Save button, and a Filter that appears when a key is typed (preferences/main.ts). -->
    <header class="rl-pref-bar" data-tauri-drag-region>
      <div class="rl-pref-tabs" role="tablist" aria-label="Preferences"></div>
    </header>
    <main class="rl-pref-pane" id="pane" role="tabpanel"></main>
    <script type="module" src="/src/preferences/main.ts"></script>
  </body>
</html>
