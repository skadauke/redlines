# Checks the workspace (type checks, lint, tests, formatting) and that the desktop app's Rust code
# and the `redlines` program compile cleanly and pass their tests. Changes that touch only docs, the
# website or Markdown files skip it; the website has its own workflow, website.yml.
name: CI

on:
  pull_request:
    paths-ignore: ['docs/**', 'website/**', '**/*.md']
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'website/**', '**/*.md']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The pnpm version comes from packageManager in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Check formatting
        run: pnpm format:check

      # Fails when the minimal embed (core and review) grows past apps/embed-smoke/size-budget.json.
      - name: Embed size budget
        run: pnpm --filter @redlines/embed-smoke size

  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Tauri's Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf build-essential curl wget file libxdo-dev libssl-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/desktop/src-tauri
            apps/desktop/redlines

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Tauri embeds the built frontend (build.frontendDist) when the Rust code compiles, and every
      # cargo in src-tauri needs the `redlines` program for its target (bundle.externalBin). The
      # desktop build makes both.
      - name: Build the redlines program and the desktop frontend
        run: pnpm --filter @redlines/desktop build

      - name: Clippy, the redlines program
        working-directory: apps/desktop/redlines
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test the redlines program
        working-directory: apps/desktop/redlines
        run: cargo test --locked

      - name: Clippy
        working-directory: apps/desktop/src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        working-directory: apps/desktop/src-tauri
        run: cargo test
