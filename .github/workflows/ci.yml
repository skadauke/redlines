# Checks the workspace (type checks, lint, tests, formatting), that the desktop app's Rust code
# and the `redlines` program compile cleanly and pass their tests, and that the Mac app's Quick Look
# extension builds and runs. Changes that touch only docs, the website or Markdown files skip it,
# except the skill's files, which are Markdown that a test checks against its source
# (apps/desktop/src/skills.node.test.ts); the website has its own workflow, website.yml. A later
# pattern of `paths` brings a file back that an earlier `!` pattern left out.
name: CI

on:
  pull_request:
    paths:
      - '**'
      - '!docs/**'
      - '!website/**'
      - '!**/*.md'
      - 'integrations/skill/**'
      - 'integrations/*/skills/**'
  push:
    branches: [main]
    paths:
      - '**'
      - '!docs/**'
      - '!website/**'
      - '!**/*.md'
      - 'integrations/skill/**'
      - 'integrations/*/skills/**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # DIAG (never merged): the timing files alone on a runner, one file at a time, to be read beside
  # the same tests inside `check`, where 400 other test files share the runner's 4 vCPUs.
  timing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Timing tests alone
        run: pnpm exec vitest run --no-file-parallelism packages/editor/src/blocks/cost.test.ts packages/editor/src/blocks/hidden.test.ts packages/editor/src/preview/long-document.test.ts
        env:
          REDLINES_COST: check

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The pnpm version comes from packageManager in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test
        env:
          # The timing tests (blocks/cost.test.ts, hidden.test.ts) run here on pushes to main, on a
          # runner that does nothing else. Pull requests skip them while Epic #329's lanes merge a dozen
          # PRs a day; main's runs and the Epic's Sunday sweep still run them.
          REDLINES_COST: check

      - name: Check formatting
        run: pnpm format:check

      # Fails when the minimal embed (core and review) grows past apps/embed-smoke/size-budget.json.
      - name: Embed size budget
        run: pnpm --filter @redlines/embed-smoke size

      # Fails when the website's bundle (the editor, review, the agents' runs, its stylesheet or its
      # fonts) grows past apps/website-embed/size-budget.json.
      - name: Website embed size budget
        run: pnpm --filter @redlines/website-embed size

  # The Mac app's Quick Look extension is Swift, which no other job compiles: it is built here for
  # both architectures, and its renderer is run in the system's JavaScriptCore on the fixtures of
  # apps/desktop/quicklook (apps/desktop/scripts/build-quicklook).
  quicklook:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the Quick Look extension and check it
        run: apps/desktop/scripts/build-quicklook --check

  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Tauri's Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf build-essential curl wget file libxdo-dev libssl-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/desktop/src-tauri
            apps/desktop/redlines

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Tauri embeds the built frontend (build.frontendDist) when the Rust code compiles, and every
      # cargo in src-tauri needs the `redlines` program for its target (bundle.externalBin). The
      # desktop build makes both.
      - name: Build the redlines program and the desktop frontend
        run: pnpm --filter @redlines/desktop build

      - name: Clippy, the redlines program
        working-directory: apps/desktop/redlines
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test the redlines program
        working-directory: apps/desktop/redlines
        run: cargo test --locked

      - name: Clippy
        working-directory: apps/desktop/src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        working-directory: apps/desktop/src-tauri
        run: cargo test
