# The journeys: Playwright in WebKit, driving the desktop app's page as a person does, with
# screenshots (apps/desktop/journeys). It runs on a Mac, since WebKit there is the app's engine
# and the approved screenshots (baselines) are drawn by it. It is the testing tiers:
#
# - a pull request runs the short tier only when someone adds the `journeys` label (lanes run their
#   journeys locally and attach the screenshots, and main's full run and the sweep run them all):
#   the smoke journeys, and the journeys tagged for the areas of the paths it changes
#   (src/areas.ts), in the light look at 100%;
# - main runs the middle tier from ci.yml's full run, every two hours (not on every push, which
#   kept a Mac busy on runs that the next merge cancelled): every journey in the light look and the
#   smoke journeys in the other three looks (dark, and 200% text, light and dark), then the
#   long-document journeys (`@long`) alone, in their own step with one worker; nobody waits on it;
# - the sweep, by manual dispatch, runs the full tier: every journey in all four looks, and the
#   long-document ones.
#
# Every run uploads the screenshots (and the diffs of any that changed) as `journeys-test-results`,
# and the look review's folder as `look-review` (apps/desktop/journeys/look-review.md).
name: Journeys

on:
  pull_request:
    # Only adding the `journeys` label runs them on a pull request; a push to it doesn't, which
    # spares the Macs.
    types: [labeled]
    paths:
      - '**'
      - '!docs/**'
      - '!website/**'
      - '!**/*.md'
      # The sample document is a journeys input (the smoke baseline opens it).
      - 'apps/desktop/src/sample.md'
  workflow_dispatch:
  # Called by ci.yml's full run (every two hours), with `main-tier`: the middle tier, as a push.
  workflow_call:
    inputs:
      main-tier:
        type: boolean
        default: false

permissions:
  contents: read

# A newer push to a pull request replaces its run, and a newer commit on main replaces the run of
# the one before, so that only the newest main commit holds a macOS runner. The sweep is left to
# finish, and so is the scheduled run that ci.yml's full run calls.
concurrency:
  group: journeys-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' && github.event_name != 'schedule' }}

jobs:
  # A pull request runs the journeys only when it changes them (apps/desktop/journeys) or carries
  # the `journeys` label; lanes run their journeys on their own machines and attach the pictures.
  # Main and the sweep always run.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}
          persist-credentials: false

      - name: Decide
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          LABELED: ${{ contains(github.event.pull_request.labels.*.name, 'journeys') }}
          UNTIL_SWEEP: true
        shell: bash
        run: |
          run=true
          if [ "$EVENT" = pull_request ]; then
            # Until Epic #537's final sweep, no Mac jobs on pull requests, label or not: dispatch
            # the workflow by hand (gh workflow run journeys.yml --ref <branch>).
            run=false
            [ "$LABELED" = true ] && [ "$UNTIL_SWEEP" != true ] && run=true
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "The journeys run: $run"

  journeys:
    needs: gate
    if: ${{ needs.gate.outputs.run == 'true' }}
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          # A pull request's changed paths come from its merge base with the target branch. (The strings:
          # in an expression 0 is false, and `cond && 0 || 1` would be 1.)
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}
          persist-credentials: false

      # The pnpm version comes from packageManager in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install WebKit
        run: pnpm --filter @redlines/journeys exec playwright install webkit

      # The journeys for this pull request: the smoke ones and those of the areas it changes.
      - name: Choose the journeys
        id: choose
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          grep=''
          if [ "$EVENT" = pull_request ]; then
            # The list is written first, so that a failed diff fails the step: it must not be read
            # as "no paths" and run the smoke journeys alone. No rename detection, so that a file
            # moved out of an area is listed by its old path too.
            git diff --name-only --no-renames "$BASE...$HEAD" > "$RUNNER_TEMP/changed.txt"
            grep=$(node --experimental-strip-types --disable-warning=ExperimentalWarning \
              apps/desktop/journeys/scripts/areas.ts < "$RUNNER_TEMP/changed.txt")
          fi
          echo "grep=$grep" >> "$GITHUB_OUTPUT"
          echo "The journeys: ${grep:-all}"

      # One run, so that its report holds every picture. A pull request: the light look, the journeys
      # chosen. Main: every journey in the light look and the smoke journeys in the other three
      # (JOURNEYS_OTHER_GREP). The sweep: every journey in all four. A failure here doesn't stop the
      # screenshots from being collected below.
      - name: Run the journeys
        env:
          EVENT: ${{ github.event_name }}
          GREP: ${{ steps.choose.outputs.grep }}
          MAIN_TIER: ${{ inputs.main-tier }}
        run: |
          [ "$MAIN_TIER" = true ] && EVENT=push
          case "$EVENT" in
            pull_request) export JOURNEYS_PROJECTS=light ;;
            push) export JOURNEYS_PROJECTS=all JOURNEYS_OTHER_GREP='@smoke' ;;
            *) export JOURNEYS_PROJECTS=all ;;
          esac
          if [ -n "$GREP" ]; then
            pnpm --filter @redlines/journeys test --grep "$GREP"
          else
            pnpm --filter @redlines/journeys test
          fi

      # The long-document journeys (`@long`) measure stalls, so they run alone, with one worker, after
      # the rest: on main and in the sweep, never on a pull request.
      - name: Run the long-document journeys
        if: ${{ !cancelled() && github.event_name != 'pull_request' }}
        env:
          JOURNEYS_PROJECTS: light
          JOURNEYS_LONG: '1'
        run: pnpm --filter @redlines/journeys test --grep @long --workers=1 --retries=0

      - name: Collect the screenshots for the look review
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: pnpm --filter @redlines/journeys look

      - name: Upload the screenshots and diffs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: journeys-test-results
          path: |
            apps/desktop/journeys/test-results/
            apps/desktop/journeys/playwright-report/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload the look review
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: look-review
          path: apps/desktop/journeys/look-review/
          retention-days: 14
          if-no-files-found: ignore
