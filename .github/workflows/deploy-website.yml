# The website's build and deploy, in ONE place, reachable two ways:
#
#   - workflow_call  — release.yml calls it as its last job, once the release
#                      has its files, so the Download section shows the new
#                      version and the sizes of the files. (It has no
#                      `release` trigger of its own: that would deploy as soon
#                      as the release is published, before its files are
#                      there, and then once more.)
#   - workflow_dispatch — run it by hand to redeploy the site WITHOUT a
#                      release (a copy fix, a new section).
#
# NOT on pushes to main, yet: until launch, the site is deployed by hand, so a
# change to website/ goes live only when someone runs this. At launch, add
#
#   push:
#     branches: [main]
#     paths: ['website/**']
#
# to redeploy whenever website content lands on main. Pull requests and pushes
# that touch website/ are already built, without deploying, by website.yml.
#
# The site is a static-exported Next.js app under website/ (output: 'export').
# Its demo panels are the real editor, bundled by apps/website-embed into
# website/public/embed/ before the site builds; the deploy fails when that
# bundle is missing or over its size budget, or when the comparison disagrees
# with docs/design.md. It builds to website/out/ and deploys to GitHub Pages.
# Download buttons use the stable releases/latest/download/ permalinks, so a
# release only needs this to run to refresh the version and sizes shown
# (npm run sync-release).
#
# Least privilege: `build` runs npm and Next.js with read-only permissions, and
# only `deploy`, which runs no project code, can write to Pages and mint the
# OIDC token that deploy-pages needs. A caller (workflow_call) must grant its
# calling job contents: read, pages: write and id-token: write.
#
# Called from release.yml, this runs in the release's event: github.event_name
# is `release`, and github.event.release is the release. Hence the checks below.
#
# Attacker-influenceable values (the release tag) reach `run:` bodies only
# through `env:`, never inline `${{ }}` interpolation.
#
# ONE-TIME SETUP (needs a repository admin):
#   1. Settings → Pages → Build and deployment → Source = "GitHub Actions".
#      GITHUB_TOKEN can't enable Pages, so configure-pages fails with a clear
#      message until this is done.
#   2. Settings → Environments → github-pages → Deployment branches and tags:
#      add a tag rule `v*`. A release's run (release.yml) happens on the
#      release's tag, and the environment only allows the default branch until
#      told otherwise.
#   3. The site's custom domain is www.redlines.md. Once GitHub has issued
#      its certificate, turn on "Enforce HTTPS" (Settings → Pages). Actions
#      deploys ignore a CNAME file, so website/public/CNAME is optional. The
#      site's base path follows by itself: /<repository> without a custom
#      domain, / with one.
name: Deploy website

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      release_tag:
        description: 'The release this deploy corresponds to (blank for standalone runs)'
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: deploy-website
  cancel-in-progress: false

jobs:
  build:
    # A prerelease never becomes the "latest" release, so it changes nothing.
    if: github.event_name != 'release' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read # configure-pages reads the site's URL and base path
    defaults:
      run:
        working-directory: website
    steps:
      # A release's run starts on the release's tag. Build the default branch
      # instead, so a release never rolls the site back to older content; the
      # release itself only refreshes the download metadata.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'release' && github.event.repository.default_branch || '' }}
          persist-credentials: false

      # The demos' bundle (apps/website-embed) is built here and never
      # committed. pnpm is the first third-party action in a job whose output is
      # published, so it is pinned to a commit, as release.yml pins its own.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          # No dependency cache in a deploy: a cache entry written by another
          # run could end up in the published site.
          package-manager-cache: false

      - name: Install the demos' bundle's dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile --filter @redlines/website-embed...

      - name: Build the demos' bundle
        working-directory: .
        run: pnpm --filter @redlines/website-embed build

      - name: Hold the demos' bundle to its size budget
        working-directory: .
        run: pnpm --filter @redlines/website-embed check-size

      - name: Install dependencies
        run: npm ci

      - name: Refresh release metadata (version and sizes for the Download section)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
        run: npm run sync-release

      - name: Hold the comparison to docs/design.md §4
        run: npm run compare:check

      - name: Read the Pages URL and base path
        id: pages
        uses: actions/configure-pages@v6

      - name: Build static site
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          SITE_URL: ${{ steps.pages.outputs.base_url }}
          # A deploy never ships the fallbacks alone because the bundle is missing.
          REQUIRE_EMBED: '1'
        run: GIT_SHA="$(git rev-parse HEAD)" npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: website/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write # publish the Pages deployment
      id-token: write # prove to Pages that the deployment comes from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
